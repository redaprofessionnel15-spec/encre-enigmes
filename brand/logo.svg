<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1f2a47"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d48f"/>
      <stop offset="55%" stop-color="#d6a650"/>
      <stop offset="100%" stop-color="#9c6b28"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Anneau discret (visible dans le cercle YouTube) -->
  <circle cx="400" cy="400" r="350" fill="none" stroke="#d6a650" stroke-opacity="0.35" stroke-width="6"/>
  <circle cx="400" cy="400" r="332" fill="none" stroke="#d6a650" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Goutte d'encre dorée -->
  <path d="M400 120 C 360 205, 225 340, 225 475 A 175 175 0 0 0 575 475 C 575 340, 440 205, 400 120 Z" fill="url(#gold)"/>

  <!-- Reflet -->
  <ellipse cx="320" cy="440" rx="28" ry="62" fill="#ffffff" fill-opacity="0.22" transform="rotate(18 320 440)"/>

  <!-- Trou de serrure -->
  <circle cx="400" cy="450" r="50" fill="#0f1626"/>
  <path d="M378 480 L 422 480 L 438 590 L 362 590 Z" fill="#0f1626"/>
</svg>
